services:
  postgres:
    image: postgres:16-alpine
    container_name: upboard-iot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-upboard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-upboard_iot}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-upboard} -d ${POSTGRES_DB:-upboard_iot}"]
      interval: 5s
      timeout: 3s
      retries: 20

  mqtt:
    image: eclipse-mosquitto:2
    container_name: upboard-iot-mqtt
    restart: unless-stopped
    ports:
      - "${MQTT_PORT:-1883}:1883"
    environment:
      MQTT_DEVICE_USERNAME: ${MQTT_DEVICE_USERNAME:-upboard_device}
      MQTT_DEVICE_PASSWORD: ${MQTT_DEVICE_PASSWORD}
      MQTT_INGEST_USERNAME: ${MQTT_INGEST_USERNAME:-upboard_ingest}
      MQTT_INGEST_PASSWORD: ${MQTT_INGEST_PASSWORD}
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mosquitto/acl:/mosquitto/config/acl:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    command: >
      sh -c "
      rm -f /mosquitto/data/passwords &&
      touch /mosquitto/data/passwords &&
      chmod 0600 /mosquitto/data/passwords &&
      mosquitto_passwd -b /mosquitto/data/passwords \"$${MQTT_DEVICE_USERNAME}\" \"$${MQTT_DEVICE_PASSWORD}\" &&
      mosquitto_passwd -b /mosquitto/data/passwords \"$${MQTT_INGEST_USERNAME}\" \"$${MQTT_INGEST_PASSWORD}\" &&
      chown mosquitto:mosquitto /mosquitto/data/passwords &&
      chmod 0600 /mosquitto/data/passwords &&
      exec mosquitto -c /mosquitto/config/mosquitto.conf"

  web:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: upboard-iot-web
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      mqtt:
        condition: service_started
    ports:
      - "${APP_PORT:-18080}:8000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-upboard}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-upboard_iot}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      SESSION_SECRET: ${SESSION_SECRET}
      MQTT_HOST: mqtt
      MQTT_PORT: 1883
      MQTT_INGEST_USERNAME: ${MQTT_INGEST_USERNAME:-upboard_ingest}
      MQTT_INGEST_PASSWORD: ${MQTT_INGEST_PASSWORD}

volumes:
  postgres_data:
  mosquitto_data:
  mosquitto_log:
